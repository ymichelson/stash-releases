        <span>Let others at ${esc(u)} find it<br><small style="color:var(--ink2);font-size:13px">They see its name, number, lecturer, term and roughly how many people — nothing inside.</small></span></label>
      <div id="s-res" aria-live="polite"></div>
      <button class="btn primary wide" type="submit">Start the course</button></form>
    <p class="alt"><a href="?find=1${LQ}">Back to search</a></p></div></div>`);
  const f = document.getElementById("start-form");
  f.addEventListener("submit", async e => { e.preventDefault(); const num = f["s-num"].value, name = f["s-name"].value.trim(); if (!name) return f["s-name"].focus();
    const dup = LISTED.find(x => num && norm(x.number) === norm(num) && f["s-term"].value === x.term);
    if (dup) { document.getElementById("s-res").innerHTML = `<p class="note" style="color:var(--ink)">${esc(dup.course)} is already here for ${esc(dup.term)} — join it, so everyone taking it is in one place.</p>${cardRow(dup).replace(">Open<", ">Join it instead<")}`; return; }
    const b = f.querySelector("[type=submit]"); b.setAttribute("aria-busy", "true"); b.innerHTML = `<span class="spin" aria-hidden="true"></span><span>Starting…</span>`;
    setTimeout(() => { location.href = `${CONFIG.hub}?state=empty`; }, 600); });
}
const code = readCode();
/* On the public address the hub joins for real (it looks the code up itself; this page's preview needs the `preview` Edge Function, not live yet). */
if (location.hostname === "ymichelson.github.io") location.replace(`../hub/${code ? "?code=" + code + LQ : lang === "he" ? "?lang=he" : ""}`);
else if (params.get("find")) find(); else if (code) load(code);
else if ((params.get("code") || "").length) problem({ status: "unknown" }); else start();
addEventListener("popstate", () => location.reload());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => document.querySelectorAll("img[data-art]").forEach(i => i.src = art(i.dataset.art)));
})();
</script>
