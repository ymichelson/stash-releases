/* sidebar: your courses */

  .side { display:flex; flex-direction:column; position:sticky; top:0; height:100dvh; padding:18px 12px 14px; border-inline-end:1px solid var(--hair); }
}
.brand { display:flex; align-items:center; gap:8px; padding:4px 10px 18px; font:500 17px/1 var(--display); letter-spacing:-.01em; text-decoration:none; }

/* kinds */

/* stickers on a sheet */

  box-shadow:0 0 0 1px var(--hair); opacity:0; transition:opacity .12s, background-color .12s; }

@media (hover:hover) and (pointer:fine) { .sheet:hover .react-btn, .sheet:focus-within .react-btn, .react-btn[aria-expanded="true"] { opacity:1; } .sheet:hover .label .stk, .sheet:focus-within .label .stk { opacity:0; } }

/* earlier weeks: rows that open in place */

/* phone bottom bar */

.list { margin:0; padding:0; list-style:none; }

  opacity:0; transform:scale(.96); transform-origin:top right; transition:opacity .14s var(--ease-out), transform .2s var(--ease-out); }

.menu button, .menu a { display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border:0; border-radius:8px; background:none; text-align:start; font:400 14px/1.2 var(--font); text-decoration:none; }

.menu .danger { color:var(--red); }
.covers { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
.covers button { padding:0; border:0; border-radius:10px; overflow:hidden; aspect-ratio:3/1; box-shadow:0 0 0 1px var(--hair); background:var(--paper); }

/* coming up (dates) */

/* sections inside a course: quiet text tabs, coral under the open one (like the panel's tabs) */
.sections { display:flex; gap:20px; margin:30px 0 -14px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--hair); }

/* live: someone else's upload in progress */

@keyframes fill { to { transform:scaleX(1); } }
.live-dot { width:7px; height:7px; border-radius:50%; background:var(--ink); flex:none; }
/* class page: one place for a cohort, across its courses */
.class-head { position:relative; display:flex; align-items:flex-end; min-height:132px; padding:22px 32px 24px; border-radius:16px; background:var(--paper); box-shadow:0 0 0 1px var(--hair); overflow:hidden; }

.cw { margin-top:18px; }

.cw-h .thumb { position:relative; width:44px; height:30px; border-radius:6px; overflow:hidden; background:var(--paper); box-shadow:0 0 0 1px var(--hair); flex:none; }

.shelf-link { display:flex; align-items:center; gap:6px; width:100%; padding-top:8px !important; padding-bottom:8px !important; border:0; background:none; text-align:start; text-decoration:none; border-radius:6px; }

/* projector: the round-7 poster, QR inside its card. Always light paper: a projector and phone cameras need ink on white */

/* someone near you is sharing a course (nearby.js); at most 3, never joins by itself */
.near { display:grid; gap:8px; margin:0 0 12px; }
.near-card { display:flex; align-items:center; gap:10px; padding:10px 10px 10px 12px; border-radius:12px; background:var(--sheet); box-shadow:var(--shadow-sheet), 0 0 0 1px var(--hair); animation:lineIn .26s var(--ease-out); }

#float-note { position:fixed; z-index:30; left:50%; translate:-50% 0; bottom:calc(84px + env(safe-area-inset-bottom)); max-width:calc(100vw - 32px); padding:9px 14px; border-radius:12px;
  background:var(--sheet); box-shadow:var(--shadow-float), 0 0 0 1px var(--hair); font:400 13px/1.4 var(--font); color:var(--ink2); animation:noteIn .26s var(--ease-out); }

/* people's content keeps its own direction inside a page of the other direction */
.k-note p, .k-link h3, .k-file b, .slip b, .big.note, .ghost-t { unicode-bidi:plaintext; text-align:start; }

.status:empty { display:none; }
.coming button { color:var(--ink2); unicode-bidi:isolate; }

.strip { -webkit-mask-image:linear-gradient(to left, transparent, #000 28px); mask-image:linear-gradient(to left, transparent, #000 28px); }
[dir="rtl"] .strip { -webkit-mask-image:linear-gradient(to right, transparent, #000 28px); mask-image:linear-gradient(to right, transparent, #000 28px); }
@media (max-width:699px) { .seg { margin-top:10px; margin-inline:-16px; padding-inline:16px; max-width:none; width:calc(100% + 32px); border-radius:0; background:none; } .seg button[aria-selected="true"] { background:var(--well); box-shadow:none; } }

/* ===== the shared desk (Jonathan's pick, concept A) =====
   Top: who the course is + search. Desk: this week, lying where people put it; people sit at its top edge, things slide
   in from them; your own seat is the desk's bottom edge (add/paste/drop). Right: the course's fixed info. */
.hd { display:flex; align-items:center; gap:16px; padding-top:22px; flex-wrap:wrap; }
.hd .cov { position:relative; width:148px; height:64px; flex:none; border-radius:12px; overflow:hidden; background:var(--paper); box-shadow:0 0 0 1px var(--hair); }
.hd .cov img { position:absolute; top:0; right:0; height:100%; width:auto; }
[dir="rtl"] .hd .cov img { right:auto; left:0; transform:scaleX(-1); }
.hd .id { min-width:0; }
.hd .shelf { display:block; font:500 11px/1 var(--font); color:var(--ink2); margin-bottom:5px; }
.hd h1 { margin:0; font:500 28px/1.1 var(--display); letter-spacing:-.016em; }
.hd .meta { margin-top:4px; font-size:13px; color:var(--ink2); }
/* who's here now (core.js Presence): quiet initial circles in the course header line, like a shared doc's viewers */
.here-slot:empty { display:none; }
.here-now { display:inline-flex; align-items:center; vertical-align:middle; margin-inline-start:8px; padding-inline-start:6px; }
.pc { position:relative; display:grid; place-items:center; width:26px; height:26px; margin-inline-start:-4px; padding:0; border:0; border-radius:50%;
  font:600 10.5px/1 var(--font); letter-spacing:-.01em; box-shadow:0 0 0 2px var(--ring, var(--sheet)); cursor:default; unicode-bidi:isolate; }
.pc.t-coral { background:var(--pc-coral); color:var(--pc-coral-ink); } .pc.t-butter { background:var(--pc-butter); color:var(--pc-butter-ink); }
.pc.t-sky { background:var(--pc-sky); color:var(--pc-sky-ink); } .pc.more { background:var(--well); color:var(--ink2); font-weight:500; cursor:pointer; }
.pc[data-c] { background:var(--fl); color:var(--fil); }
:root[data-theme="dark"] .pc[data-c] { background:var(--fd); color:var(--fid); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pc[data-c] { background:var(--fd); color:var(--fid); } }
.pc.has-photo > img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
.pc.in { animation:pc-in .22s var(--ease-out, ease-out) both; }
@keyframes pc-in { from { opacity:0; transform:scale(.6); } }
.pc::after { content:attr(data-name); position:absolute; top:calc(100% + 6px); inset-inline-end:-4px; z-index:5; max-width:min(70vw, 280px); overflow:hidden; text-overflow:ellipsis; padding:5px 8px; border-radius:6px;
  background:var(--primary); color:var(--on-primary); font:500 12px/1.2 var(--font); white-space:nowrap; unicode-bidi:plaintext; pointer-events:none; opacity:0; transition:opacity .12s; }
.pc:hover::after, .pc:focus-visible::after, .pc.show::after { opacity:1; }
:root { --pc-coral:#FBE4DD; --pc-coral-ink:#8A4536; --pc-butter:#FAEBCB; --pc-butter-ink:#70510D; --pc-sky:#E4EDFC; --pc-sky-ink:#345EA0; }
:root[data-theme="dark"] { --pc-coral:#4D3631; --pc-coral-ink:#F6C2B6; --pc-butter:#4A3F2A; --pc-butter-ink:#F2D9A4; --pc-sky:#2C3852; --pc-sky-ink:#B9CFF7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pc-coral:#4D3631; --pc-coral-ink:#F6C2B6; --pc-butter:#4A3F2A; --pc-butter-ink:#F2D9A4; --pc-sky:#2C3852; --pc-sky-ink:#B9CFF7; } }
@media (prefers-reduced-motion: reduce) { .pc.in { animation:none; } .pc::after { transition:none; } }
.fsubline { display:flex; align-items:center; }
.fsubline:not(:has(.sub)) .here-slot { position:absolute; top:14px; inset-inline-end:16px; }
.fsubline .here-slot { margin-inline-start:auto; position:relative; z-index:2; }
.menu [role="menuitemcheckbox"] .chk { margin-inline-start:auto; color:var(--ink2); font-size:13px; }
.hd .grow { flex:1; }
.acts-hd { display:flex; gap:8px; }
.search { display:flex; align-items:center; gap:8px; width:min(280px, 30vw); height:34px; padding:0 12px; border-radius:10px; background:var(--well); box-shadow:inset 0 0 0 1px var(--hair); color:var(--ink2); }
.search input { flex:1; min-width:0; border:0; background:none; outline:none; font:400 14px/1 var(--font); color:var(--ink); }
.search:focus-within { box-shadow:inset 0 0 0 1px var(--hair), 0 0 0 2px var(--focus); }
@media (max-width:699px) { .hd { padding-top:10px; gap:12px; } .hd .cov { width:96px; height:52px; } .hd h1 { font-size:24px; } .search, .hd .add-top { display:none; } .hd .acts-hd { flex-basis:100%; } }
.workspace { display:grid; grid-template-columns:minmax(0,1fr); gap:28px; margin-top:24px; align-items:start; }
@media (min-width:1180px) { .workspace { grid-template-columns:minmax(0,1fr) 300px; gap:40px; } }
.desk { --ink2:#565B63; position:relative; padding:26px 26px 0; border-radius:22px; background:color-mix(in srgb, var(--paper) 86%, #6b5a3e); box-shadow:inset 0 0 0 1px var(--hair), inset 0 2px 10px rgba(0,0,0,.035); }
:root[data-theme="dark"] .desk { background:#1B1915; --ink2:#B5AC9E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .desk { background:#1B1915; --ink2:#B5AC9E; } }
@media (max-width:699px) { .desk { margin:0 -16px; padding:20px 16px 0; border-radius:0; } }
.seats { position:absolute; top:-15px; inset-inline-start:24px; display:flex; gap:8px; align-items:center; }
@media (max-width:699px) { .seats { position:static; margin:-6px -16px 14px; padding:0 16px; overflow-x:auto; scrollbar-width:none; } .seat { flex:none; } }
.seat { border:0; color:var(--ink); display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px 0 5px; border-radius:999px; background:var(--sheet); box-shadow:var(--shadow-sheet), 0 0 0 1px var(--hair); font:500 12.5px/1 var(--font); transition:box-shadow .15s, transform .2s var(--spring); }
.seat .ini { width:20px; height:20px; font-size:10px; }
.seat.drop { box-shadow:0 0 0 2px var(--sky), var(--shadow-hover); transform:translateY(-2px) scale(1.06); }
.seat.more { padding:0 11px; color:var(--ink2); }
.seat.adding { box-shadow:0 0 0 1.5px var(--ink), var(--shadow-sheet); }
.desk-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
.desk-head h2 { margin:0; font:500 17px/1.25 var(--display); }
.desk-head h2 .sub { font-weight:400; color:var(--ink2); }
.desk .info { margin:0 0 14px; }
.desk #grid-now { padding:6px 2px 6px; }
@media (min-width:560px) { .desk #grid-now, .desk .fold .grid { grid-template-columns:repeat(auto-fill, minmax(148px, 1fr)); gap:24px 18px; } }
@media (min-width:700px) {
  .desk #grid-now > .sheet:nth-child(5n+1), .desk .fold .sheet:nth-child(5n+1) { rotate:-1.1deg; }
  .desk #grid-now > .sheet:nth-child(5n+2), .desk .fold .sheet:nth-child(5n+2) { rotate:.7deg; translate:0 4px; }
  .desk #grid-now > .sheet:nth-child(5n+3), .desk .fold .sheet:nth-child(5n+3) { rotate:-.4deg; translate:0 -3px; }
  .desk #grid-now > .sheet:nth-child(5n+4), .desk .fold .sheet:nth-child(5n+4) { rotate:1deg; translate:0 2px; }
  .desk .sheet { transition:rotate .25s var(--ease-out), translate .25s var(--ease-out), background-color .12s, box-shadow .2s; }
  .desk .sheet:hover, .desk .sheet:focus-within { rotate:0deg; translate:0 -3px; box-shadow:0 10px 22px rgba(0,0,0,.10), 0 0 0 1px var(--hair); z-index:2; }
}
.desk .sheet[draggable="true"] { cursor:grab; }
.desk .sheet.dragging { opacity:.4; }
/* earlier weeks: stacks at the foot of the desk; one opens and spreads below */
.desk .weeks { display:flex; flex-wrap:wrap; gap:18px 22px; margin:30px 0 0; border:0; }
.desk .week-row { border:0; }
.desk .week-row > button { position:relative; display:block; width:150px; min-height:62px; padding:12px 14px; border:0; border-radius:10px; background:var(--sheet); box-shadow:0 0 0 1px var(--hair); text-align:start; }
.desk .week-row > button::before, .desk .week-row > button::after { content:""; position:absolute; inset:0; z-index:-1; border-radius:10px; background:var(--sheet); box-shadow:0 0 0 1px var(--hair); }
.desk .week-row > button::before { transform:translate(5px,-6px) rotate(3deg); filter:brightness(.95); }
.desk .week-row > button::after { transform:translate(2px,-3px) rotate(-1.5deg); filter:brightness(.975); }
.desk .week-row { position:relative; z-index:0; }
.desk .week-row > button:hover { translate:0 -2px; }
.desk .week-row .wn { display:block; font:500 13px/1.2 var(--font); }
.desk .week-row .wt { display:block; font:400 12px/1.3 var(--font); color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px; }
.desk .week-row .cnt { position:absolute; top:10px; inset-inline-end:12px; font:500 11px/1 var(--font); color:var(--ink2); }
.desk .week-row .chev { display:none; }
.desk .week-row[data-open="true"] > button { box-shadow:0 0 0 1.5px var(--ink); }
.desk .week-row[data-open="true"] { flex-basis:100%; order:-1; }
.desk .week-row[data-open="false"] .fold { display:none; }
.desk .week-row .fold .grid { padding:16px 2px 4px; }
/* your seat: the desk's bottom edge, where you put things down */
.you { display:flex; align-items:center; gap:12px; margin:28px -26px 0; padding:12px 26px; border-top:1px dashed var(--hair-strong); border-radius:0 0 22px 22px; background:color-mix(in srgb, var(--sheet) 55%, transparent); }
.you .ini { width:28px; height:28px; }
.you p { flex:1; margin:0; min-width:0; color:var(--ink2); font-size:13px; }

.you .q { display:flex; gap:6px; }
.you .q .btn { height:32px; padding:0 11px; }
@media (max-width:699px) { .you { display:none; } }
/* the right rail: the course's fixed info, all of it typed by members */
.rail { display:grid; gap:16px; align-content:start; }
@media (min-width:1180px) { .rail { position:sticky; top:20px; } }
.rcard { padding:14px 16px; border-radius:14px; background:var(--sheet); box-shadow:var(--shadow-sheet), 0 0 0 1px var(--hair); }

  .p-foot { border-top-color:var(--line); }
  .p-foot .btn { height:44px; border-radius:var(--rc); }
  .close, .lift-bar .close, .panel.pv .lift-bar .close { width:32px; height:32px; border-radius:var(--rc); background:var(--sheet); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  .close:active { background:var(--well); }
  .way { border-radius:var(--r); background:var(--sheet); box-shadow:inset 0 0 0 1px var(--line); }
  .way[aria-pressed="true"] { background:var(--sky-pale); box-shadow:inset 0 0 0 1px var(--sky); }
  .codebox .cb { border-radius:var(--rc); background:var(--sheet); box-shadow:inset 0 0 0 1px var(--line); }
  .codebox:focus-within .cb.on { box-shadow:inset 0 0 0 1px var(--line), 0 0 0 2px var(--focus); }
  .menu { border-radius:var(--rc); box-shadow:0 8px 24px rgba(0,0,0,.10), 0 0 0 1px var(--line); }
  .menu button, .menu a { border-radius:var(--r); }
  .seat { border-radius:var(--rc); box-shadow:inset 0 0 0 1px var(--line); }
  .notice, .near-card, .welcome { border-radius:var(--r); background:none; box-shadow:inset 0 0 0 1px var(--line); }
  .welcome { padding:16px 0; box-shadow:none; border-block:1px solid var(--line); border-radius:0; }
  #float-note { border-radius:var(--rc); box-shadow:0 6px 20px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
  .sk, .sk-sheet { border-radius:var(--r); }
  /* Add: plain rows with hairlines, one wide button */
  .arow { min-height:52px; border-radius:var(--r); font:400 16px/1.2 var(--font); }
  .addlist .arow + .arow { border-top:1px solid var(--line); border-radius:0; }
  .arow .ai { width:28px; height:28px; border-radius:0; background:none; color:var(--ink2); }
  .panel.add .p-foot .btn.primary { height:46px; border-radius:var(--rc); font:500 15px/1 var(--font); }
  /* an opened thing: the thing, who and when, Thanks, one or two buttons */
  .panel.pv .lift-bar { padding:8px 16px 0; }
  .pv-stage { padding:8px 20px !important; }
  .pv-photo { position:relative; border-radius:var(--r); background:var(--well); box-shadow:none; }
  .pv-photo::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 1px var(--edge); pointer-events:none; }
  .pv-page { border-radius:1px; box-shadow:0 0 0 1px var(--edge); }
  .pv-note { padding:16px; border-radius:var(--r); background:var(--sheet); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); font:400 17px/1.5 var(--font); }
  .pv-note::before { content:""; display:block; width:16px; height:2px; margin-bottom:12px; background:var(--butter); }
  .pv-meta h3 { font:500 18px/24px var(--display); letter-spacing:0; }
  .pv-meta p { font-size:14px; font-variant-numeric:tabular-nums; }
  .thanks { height:36px; padding:0 12px; border-radius:var(--rc); background:var(--sheet); box-shadow:inset 0 0 0 1px var(--line); font:500 14px/1 var(--font); }
  .thanks[aria-pressed="true"] { box-shadow:inset 0 0 0 1px var(--sky); }
  .pv-acts { border-top:1px solid var(--line); padding:12px 20px calc(12px + env(safe-area-inset-bottom)); }
  .pv-acts .btn { height:46px; border-radius:var(--rc); font:500 15px/1 var(--font); }
  .pv-acts .btn:not(.primary) { background:var(--sheet); box-shadow:inset 0 0 0 1px var(--line); }
}

/* ===== Q1 · Quiet type (27 Oct 2026, docs/shared/hub-design/quiet-2026-10-27; the Mac hub does the same): one type scale —
   28 the name, 14 everything you read (500 for headings and titles), 12 grey for who / when; one grey; one accent (the nearest
   deadline in coral); no counts after headings, no "new" dots (the section says it), links ink, no site letter ===== */
@media (max-width:699px) {
  .fcover h1 { margin:0; }
  .fsubline { min-height:20px; margin-top:2px; }
  .fcover .sub { font:400 12px/16px var(--font); }
  .moment { margin:4px 0 0; font:400 12px/16px var(--font); }
  .moment .k { color:var(--ink2); }
  .icard .v { margin-top:3px; font:500 14px/20px var(--font); }
  .icard.hot .l { color:var(--ink2); }
  .icard.hot .s { color:var(--soon); }
  .fsec { margin-top:24px; }
  .fh, .ftabs button { font:500 14px/20px var(--font); letter-spacing:0; }
  .fh { margin:0 0 10px; }
  .ftabs { gap:16px; margin:0 0 10px; }
  .ftabs button { padding:0; }
  .ftabs button[aria-selected="true"] { color:var(--ink); box-shadow:none; }
  .sheet .cap { padding-top:8px; font:500 14px/20px var(--font); }
  .sheet .cap .newtab { display:none; }
  .sheet .label { padding-top:1px; }
  .sheet .label .due { color:var(--ink); } /* the dates strip's nearest deadline is the one accent */
  .k-note::before { display:none; }
  .k-note p { font:400 14px/20px var(--font); -webkit-line-clamp:5; }
  .k-link, .k-link.has-pic { display:flex; flex-direction:column; align-items:stretch; gap:4px; }
  .sheet .k-link .mono { display:none; }
  .k-link h3 { order:-1; margin:0; font:500 14px/20px var(--font); -webkit-line-clamp:4; }
  .k-link.has-pic h3 { -webkit-line-clamp:2; }
  .k-link .dom { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .k-link .dom i { display:none; }
  .k-link.has-pic .dom { display:none; } /* the picture sits where the site would; the name under the tile is the site */
  .p-head h2, .pv-meta h3 { font:500 17px/22px var(--display); }
  .pv-note { font:400 16px/1.5 var(--font); }
  .pv-note::before { display:none; }
}

/* installed (PWA standalone, nearby-share's pwa.js sets the class): no "get the app" nudge; clear the status bar and home indicator */
html.pwa-standalone .nudge { display:none !important; }
html.pwa-standalone .hd { padding-top:max(14px, env(safe-area-inset-top)); }

/* reduced motion: movement becomes a short fade */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  .panel, .tray, .menu { transform:none !important; transition:opacity .15s linear !important; }
  @media (max-width:699px) { .panel { opacity:0; } .panel.in { opacity:1; } }
  .week-row .fold { transition:none; }
  .nearby-anim span { animation:none; opacity:.5; }
  .nearby-anim span:nth-child(1) { transform:scale(.6); } .nearby-anim span:nth-child(2) { transform:scale(.8); } .nearby-anim span:nth-child(3) { transform:scale(1); }
}
</style>
</head>
